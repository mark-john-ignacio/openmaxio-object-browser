version: "3.9"

services:
  app:
    # Build from this repository's Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    image: openmaxio/object-browser:local
    restart: unless-stopped
    environment:
      # Connect the UI to the MinIO service via the internal Docker network
      CONSOLE_MINIO_SERVER: http://minio:9000
      # Configure JWT encryption parameters (set real secrets via Coolify env/secrets)
      CONSOLE_PBKDF_PASSPHRASE: ${CONSOLE_PBKDF_PASSPHRASE:-change-me-passphrase}
      CONSOLE_PBKDF_SALT: ${CONSOLE_PBKDF_SALT:-change-me-salt}
    depends_on:
      - minio
    ports:
      - "${APP_PORT:-8080}:8080"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-console}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-consoleconsole}
      # Public URL MinIO should advertise (behind Coolify/proxy)
      # e.g., https://s3.example.com
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
      # Optional: enable virtual-hosted-style buckets (requires DNS wildcard)
      # e.g., s3.example.com to support bucket.s3.example.com
      MINIO_DOMAIN: ${MINIO_DOMAIN:-}
    volumes:
      - minio_data:/data
    # No host port publishing: rely on internal networking and Coolify routing.

volumes:
  minio_data:
